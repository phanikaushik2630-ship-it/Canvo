<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Background Tile with warm artisanal cream -->
  <rect width="180" height="180" rx="40" fill="#FAF8F5" />
  <rect width="176" height="176" x="2" y="2" rx="38" stroke="#E6DEC8" stroke-width="2" />

  <g transform="translate(26, 26) scale(2.666)">
    <defs>
      <linearGradient id="leafTerraApple" x1="6" y1="6" x2="30" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F2824B" />
